name: sync-recent-form

# Monthly refresh of recent_form_summary in knowledge/teams.yaml. Pulls each
# team's last 5 fixtures from api-football and asks Claude to rewrite the
# one-sentence summary in the existing brief voice. Any change opens a PR
# for editorial review — summaries never write straight to main.
#
# IMPORTANT: trigger the first run manually via workflow_dispatch, not by
# waiting for the cron. The first run is also the team-ID bootstrap (50+
# /teams lookups) and you want to eyeball the discovered IDs in the PR
# before they bake in.

on:
  schedule:
    # 1st of each month, 06:00 UTC. FIFA rankings drop on a similar cadence;
    # form summaries don't drift faster than this between releases.
    - cron: "0 6 1 * *"
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: sync-recent-form
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - uses: astral-sh/setup-uv@v8.2.0
        with:
          version: latest

      - name: uv sync
        run: uv sync

      - name: Run sync
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: uv run python -m backend.sync_recent_form

      - name: Open PR if anything changed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -z "$(git status --porcelain knowledge/)" ]; then
            echo "no changes to knowledge/ — exiting cleanly"
            exit 0
          fi
          DATE=$(date -u +%Y-%m-%d)
          BRANCH="auto/sync-recent-form-$DATE"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add knowledge/
          git commit -m "chore: monthly recent_form_summary refresh ($DATE)"
          git push origin "$BRANCH"
          gh pr create \
            --base main \
            --head "$BRANCH" \
            --title "chore: monthly recent_form_summary refresh ($DATE)" \
            --body "Auto-generated by the sync-recent-form workflow.

          Each updated team's recent_form_summary in knowledge/teams.yaml is
          a one-sentence Claude rewrite based on the team's last 5 fixtures
          from api-football. Please review the wording before merging — the
          model occasionally drifts off the editorial voice and these strings
          ship straight into hotel-facing briefs.

          If any summary looks wrong, edit it directly in this PR before
          merging. If the IDs file added a wrong team mapping, delete the
          offending entry from knowledge/api_football_team_ids.yaml and the
          next run will re-discover it."
