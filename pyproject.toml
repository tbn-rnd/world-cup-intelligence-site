[project]
name = "world-cup-intelligence-site"
version = "0.1.0"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.7,<3",
  "pyyaml>=6.0,<7",
  "httpx>=0.27,<1",
  "tenacity>=9.0,<10",
  "anthropic>=0.40,<1",
]

[dependency-groups]
dev = [
  "pytest>=8.2,<9",
  "pytest-mock>=3.14,<4",
  "ruff>=0.6,<1",
  "mypy>=1.11,<2",
  "types-PyYAML",
  "respx>=0.21,<1",
]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
addopts = "-v --tb=short"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["backend"]
